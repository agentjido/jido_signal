name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing v-prefixed SemVer tag to publish"
        required: true
        type: string
      dry_run:
        description: "Validate the release without Hex or GitHub publication"
        required: false
        type: boolean
        default: false
      hex_dry_run:
        description: "Run Hex package validation without publication"
        required: false
        type: boolean
        default: false
permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Release
    uses: agentjido/github-actions/.github/workflows/jido-release.yml@c782c2d13584f0a7b43027eedd83807ed1a2b7dc
    with:
      operation: publish
      tag_name: ${{ inputs.tag_name }}
      otp_version: "29"
      elixir_version: "1.20"
      preflight_command: >-
        mix quality &&
        MIX_ENV=test mix test --cover --warnings-as-errors &&
        mix hex.audit
      release_notes_mode: generated
      dry_run: ${{ inputs.dry_run || false }}
      hex_dry_run: ${{ inputs.hex_dry_run || false }}
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
