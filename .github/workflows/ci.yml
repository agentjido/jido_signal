name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - release/v3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: CI
    uses: agentjido/github-actions/.github/workflows/jido-ci.yml@b42cb73e5dda2d3f54d5ac0f8e1d7d3641728dea
    secrets: inherit
    with:
      credo_command: mix credo --min-priority high
      docs_command: mix docs --warnings-as-errors
      test_command: mix test --cover --warnings-as-errors
